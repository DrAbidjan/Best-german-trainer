<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B2 Verb Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD400" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verbtrainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#12161C; --muted:#5B6571; --line:#D8DDE4;
  --accent:#FFD400; --accent-ink:#12161C;
  --good:#157347; --good-bg:#DDF2E5; --bad:#B3302F; --bad-bg:#FAE1E0;
  --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --sans:-apple-system,system-ui,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1318; --surface:#181E26; --ink:#F1F3F6; --muted:#9BA6B3; --line:#2B343F;
    --good:#5ED39A; --good-bg:#12301F; --bad:#FF8F8B; --bad-bg:#3A1A1A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:17px/1.4 var(--sans);
  -webkit-tap-highlight-color:transparent;
  min-height:100vh; min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

#app{
  max-width:560px; margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(96px + env(safe-area-inset-bottom,0px));
}
body.in-session #app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}

/* ---------- bottom navigation ---------- */
#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.in-session #nav{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center}
#nav .pill{padding:4px 22px;border-radius:999px;transition:background .15s}
#nav button[aria-current=page]{color:var(--ink)}
#nav button[aria-current=page] .pill{background:var(--accent);color:var(--accent-ink)}

/* ---------- shared bits ---------- */
.muted{color:var(--muted)}
.small{font-size:14px}
.de{font-family:var(--serif)}
mark{background:var(--accent);color:#12161C;padding:0 .18em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blank{display:inline-block;width:3em;height:1.05em;background:var(--accent);border-radius:4px;vertical-align:-.18em;margin:0 .1em}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:0 20px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45}
.btns{display:flex;gap:10px;margin-top:14px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--line)}
.say{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;vertical-align:middle}
.say:active{background:var(--line)}
.say svg.i{width:19px;height:19px}
.sec{font-family:var(--serif);font-size:22px;margin:30px 0 6px}
.page-title{font-family:var(--serif);font-size:32px;line-height:1.1;margin:4px 0 16px}

/* ---------- practise hub ---------- */
.hero{background:var(--accent);color:#12161C;border-radius:24px;padding:20px 20px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
.hero-n{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1}
.hero-n span{font-size:24px;font-weight:600;opacity:.7}
.hero-r{text-align:right}
.hero p.l{font-size:14px;font-weight:600;margin-top:4px}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:rgba(18,22,28,.16);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#12161C;border-radius:99px;transition:width .3s}
.seg{display:flex;gap:6px;margin:20px 0 4px;background:var(--surface);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:600;font-size:15px;text-align:center;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.toggle{display:flex;align-items:center;gap:10px;margin:10px 2px 0;font-size:14px;color:var(--muted);min-height:36px}
.toggle .sw{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--ink)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(16px);background:var(--bg)}
.modes{margin-top:8px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:16px 2px;border-bottom:1px solid var(--line)}
.row:active{background:rgba(127,127,127,.1)}
.row .t{flex:1;min-width:0}
.row strong{display:block;font-size:18px;line-height:1.25}
.row small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.row[disabled]{opacity:.5}
.row .chev{color:var(--muted)}
.badge-n{min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--bad);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.mlist li{display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mlist .de{font-size:19px;font-weight:700}
.mlist .en{flex:1;color:var(--muted);font-size:15px}
.mlist .cnt{font-size:13px;color:var(--bad);font-weight:600;white-space:nowrap}
.install{margin-top:18px;padding:14px 16px;border-radius:16px;border:1.5px dashed var(--line);font-size:14.5px;position:relative;padding-right:52px}
.install b{font-weight:700}
.install button{position:absolute;right:4px;top:4px}
.foot{margin-top:26px;font-size:13px;color:var(--muted);text-align:center}

/* ---------- verb entries ---------- */
.chips{display:flex;gap:8px;margin:0 0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.chips button{flex:none;min-height:40px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:15px;color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daytitle{font-family:var(--serif);font-size:22px;margin:26px 0 4px}
.entry{padding:16px 0 18px 16px;border-bottom:1px solid var(--line);border-left:5px solid var(--accent);margin-top:14px;border-bottom:0;background:var(--surface);border-radius:4px 16px 16px 4px;padding-right:12px}
.entry-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.entry h3{font-family:var(--serif);font-size:26px;line-height:1.15}
.entry .en{color:var(--muted);margin-top:0}
.entry .ex{font-family:var(--serif);font-size:19px;line-height:1.5;margin-top:10px}
.entry .tr{color:var(--muted);font-size:15.5px;margin-top:2px;font-style:italic}
.status{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.status.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.status.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}

/* ---------- sessions ---------- */
.sbar{display:flex;align-items:center;gap:10px;margin:-6px -6px 14px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.count{font-size:14px;font-weight:700;min-width:44px;text-align:right;margin-right:6px}
.stline{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-bottom:18px}
.stline b{color:var(--ink)}
.qlabel{font-size:15px;color:var(--muted);margin-bottom:8px}
.word{font-family:var(--serif);font-size:42px;line-height:1.1;font-weight:700;margin-bottom:22px;overflow-wrap:anywhere}
.word.en{font-family:var(--sans);font-size:30px;font-weight:700;line-height:1.2}
.sentence{font-family:var(--serif);font-size:25px;line-height:1.5;margin-bottom:6px}
.hint-tr{color:var(--muted);font-style:italic;margin-bottom:22px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:12px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;font-size:18px;font-weight:600;line-height:1.25}
.opt.de-opt{font-family:var(--serif);font-size:21px}
.opt:active:not([disabled]){background:var(--line)}
.opt[disabled]{color:var(--ink)}
.opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.correct::after{content:"\2713";font-weight:800}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.wrong::after{content:"\2717";font-weight:800}
.opt.dim{opacity:.5}
.field{width:100%;min-height:58px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--serif);font-size:24px}
.field.good{border-color:var(--good);background:var(--good-bg)}
.field.bad{border-color:var(--bad);background:var(--bad-bg)}
.hintline{min-height:24px;margin-top:10px;font-size:15px;color:var(--muted)}
.fb{margin-top:18px;padding:16px;border-radius:18px;border-left:6px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-family:var(--serif);font-size:22px;display:flex;align-items:baseline;gap:10px}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)}
.fb .pts{font-family:var(--sans);font-size:14px;font-weight:700}
.fb .line{margin-top:8px}
.fb .line .de{font-size:22px;font-weight:700}
.fb .ex{font-family:var(--serif);font-size:19px;line-height:1.5;margin-top:8px;color:var(--ink)}
.fb .tr{color:var(--muted);font-size:15px;font-style:italic}
.fb .btn{margin-top:14px}

/* flashcards */
.flash{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:340px;padding:24px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:26px;border-top:8px solid var(--accent);cursor:pointer;user-select:none;-webkit-user-select:none}
.flash.turned{animation:turn .22s ease-out}
@keyframes turn{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
.flash .word{margin-bottom:10px}
.flash .tap{color:var(--muted);font-size:14px;margin-top:18px}
.flash .en-line{font-size:21px;font-weight:600}
.flash .ex{font-family:var(--serif);font-size:20px;line-height:1.5;margin-top:18px}
.flash .tr{color:var(--muted);font-style:italic;margin-top:4px;font-size:16px}
.flash .say-row{display:flex;gap:4px;justify-content:center;margin-top:6px}

/* summary */
.summary{text-align:center;padding-top:18px}
.summary h2{font-family:var(--serif);font-size:34px}
.summary .big{font-family:var(--serif);font-size:72px;font-weight:700;line-height:1.1;margin-top:10px}
.summary .facts{display:flex;justify-content:center;gap:28px;margin:18px 0 8px}
.summary .facts b{display:block;font-family:var(--serif);font-size:28px}
.summary .facts span{font-size:14px;color:var(--muted)}
.summary .missed{text-align:left;margin:26px 0 8px}
.summary .stack{display:grid;gap:10px;margin-top:22px}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stats div{padding:16px 4px;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.stats div:nth-child(even){padding-left:18px}
.stats b{display:block;font-family:var(--serif);font-size:34px;line-height:1.1}
.stats span{font-size:14px;color:var(--muted)}
.dayrow{margin-top:14px}
.dayrow .top{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.dayrow .bar{margin:0;background:var(--line)}
.vtable li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.vtable .de{font-size:19px;font-weight:700;flex:1;min-width:0}
.vtable .sc{font-size:14px;color:var(--muted);white-space:nowrap}
.vtable .sc b{color:var(--good)} .vtable .sc i{font-style:normal;color:var(--bad);font-weight:700}
.danger{margin-top:28px;width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--bad);color:var(--bad);font-weight:600;text-align:center}

.selwrap{display:block;margin:20px 0 4px}
.selwrap .lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.select{width:100%;min-height:54px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px var(--sans)}
.search{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin:12px 0 4px}
.nores{color:var(--muted);padding:24px 0;text-align:center}
[hidden]{display:none!important}
.mic{width:92px;height:92px;border-radius:50%;background:var(--accent);color:#12161C;display:flex;align-items:center;justify-content:center;margin:22px auto 8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.mic svg.i{width:38px;height:38px}
.mic.live{background:#12161C;color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,212,0,.55)}50%{box-shadow:0 0 0 18px rgba(255,212,0,0)}}
.miclabel{text-align:center;color:var(--muted);font-size:15px;min-height:24px}
.spoken .w{padding:0 .12em;border-radius:4px}
.spoken .w.ok{background:var(--good-bg);color:var(--good)}
.spoken .w.close{background:var(--accent);color:#12161C}
.spoken .w.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.say-note{margin-top:14px;font-size:13.5px;color:var(--muted)}
.mini-seg{display:flex;gap:6px;margin:0 0 18px}
.mini-seg button{flex:1;min-height:40px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:15px;text-align:center;color:var(--muted)}
.mini-seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.entry-actions{display:flex;gap:2px;flex:none}
details.all{margin-top:6px}
details.all summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--ink);list-style:none}
details.all summary::-webkit-details-marker{display:none}
details.all summary::after{content:"Show";margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
details.all[open] summary::after{content:"Hide"}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card h2{font-family:var(--serif);font-size:22px;margin-bottom:6px}
.card p{margin-top:6px}
.card a.btn{text-decoration:none}
.acct-email{font-weight:700;overflow-wrap:anywhere;margin:2px 0 8px}
.notice{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.notice.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.notice.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.perks{margin:10px 0 4px}
.perks li{padding:6px 0 6px 26px;position:relative;font-size:15.5px}
.perks li::before{content:"\2713";position:absolute;left:4px;font-weight:800;color:var(--good)}
.orders li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.plainfield{font-family:var(--sans);font-size:18px;margin-top:10px}
.upsell{margin-top:18px;padding:16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--accent);font-size:15px}
.upsell .btn{margin-top:12px;min-height:48px}
.lock{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 8px 1px 5px;border-radius:99px;background:var(--accent);color:#12161C;font-size:12px;font-weight:700;vertical-align:2px}
.lock svg.i{width:13px;height:13px}
.foot a{color:inherit}
.linkbtn{text-decoration:underline;color:var(--muted);min-height:36px;padding:0 2px}
.pic{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic .emo{font-size:64px;line-height:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}
.pic.has .emo{visibility:hidden}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 6px}
.wcard .pic{border-radius:10px;border:0}
.wcard .pic .emo{font-size:46px}
.wname{margin-top:8px;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.wcard .muted{display:flex;align-items:center;justify-content:space-between;gap:4px}
.art{display:inline-block;font-family:var(--sans);font-size:.62em;font-weight:800;padding:1px 7px;border-radius:99px;vertical-align:.12em;letter-spacing:.02em}
.a-der{background:#D6E6FF;color:#12326B}.a-die{background:#FFD9DE;color:#7B1527}.a-das{background:#D9F2DF;color:#0F4A22}
@media (prefers-color-scheme:dark){.a-der{background:#1E3A66;color:#CFE0FF}.a-die{background:#5C1E2B;color:#FFD3DA}.a-das{background:#1B4A2A;color:#CDEFD6}}
.catlist li{list-style:none}
.catemo{font-size:30px;width:38px;text-align:center;flex:none}
.pflash .pic{max-width:300px}
.pflash .tap{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chatlist{max-height:46vh;min-height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cmsg{max-width:90%;align-self:flex-start;padding:8px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.cmsg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cmsg .chead{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;opacity:.75}
.cmsg p{margin:2px 0;overflow-wrap:anywhere;font-size:16.5px;line-height:1.35}
.cmsg .cact{display:flex;gap:14px}.cmsg .cact button{font-size:12.5px;opacity:.7;text-decoration:underline;padding:4px 0}
.fs{font-size:18px!important}
.tform{display:flex;gap:8px;margin-top:8px}.tform .field{flex:1;min-width:0}.tform .btn{width:auto;min-width:84px}
.plans{display:flex;gap:10px;margin:12px 0}.plan{flex:1;padding:14px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;display:flex;flex-direction:column;gap:3px}
.plan b{font-size:17px}.plan .pr{font-size:18px;font-weight:700}.plan small{color:var(--muted);font-size:13px}.plan.best{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}.plan[disabled]{opacity:.5}
.rules{margin:14px 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.rules ul{margin:6px 0 0 18px;list-style:disc}.rules li{margin:3px 0}#chnick{margin-bottom:4px}.chk{display:flex;gap:10px;align-items:center;margin:10px 0 14px;font-size:16px}
.linkbtn{text-decoration:underline;color:var(--muted);font-size:13.5px}

.glead{font-size:17px;line-height:1.5;margin:0 0 12px}
.gtab{width:100%;border-collapse:collapse;margin:14px 0;font-size:16px}

.gex{list-style:none;padding:0;margin:8px 0}
.gex li{padding:10px 2px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.gex .de{font-weight:700;font-size:17px}.gex small{display:block;color:var(--muted);font-size:14px}
.gbadge{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.gbadge.full{color:var(--good)}
.gh{font-size:18px;margin:22px 0 4px}
.gq{font-family:var(--serif);font-size:24px;line-height:1.35;margin:6px 0 18px;overflow-wrap:anywhere}
.gblank{display:inline-block;min-width:60px;border-bottom:3px solid var(--accent);margin:0 3px;text-align:center}
#nav button{min-width:0;font-size:10.5px}

.entry .en,.mlist .en,.word.en,.flash .en-line,.opt span,.gex small,.vtable .en,.wcard .small,.tr,.summary li .en{unicode-bidi:plaintext;text-align:start}

  var FREE_DAYS = [

    {"level": "B2", "verbs": [["behaupten", "to claim", "Er [behauptet], dass er die Wahrheit sagt.", "He claims that he is telling the truth."], ["zustimmen", "to agree", "Ich [stimme] dir vollkommen [zu].", "I completely agree with you."], ["widersprechen", "to contradict / disagree", "Ich möchte dir nicht [widersprechen].", "I don't want to contradict you."], ["begründen", "to justify", "Bitte [begründen] Sie Ihre Entscheidung.", "Please justify your decision."], ["überzeugen", "to convince", "Er konnte mich von seiner Idee [überzeugen].", "He was able to convince me of his idea."]]},
    {"level": "B2", "verbs": [["übernehmen", "to take over", "Ich [übernehme] die Verantwortung für diesen Fehler.", "I take responsibility for this mistake."], ["erledigen", "to complete / take care of", "Ich muss heute noch einige wichtige Aufgaben [erledigen].", "I still have to take care of some important tasks today."], ["vereinbaren", "to arrange", "Ich möchte einen Termin beim Zahnarzt [vereinbaren].", "I'd like to arrange an appointment at the dentist."], ["voraussetzen", "to require", "Diese Stelle [setzt] gute Deutschkenntnisse [voraus].", "This position requires good German skills."], ["gewährleisten", "to ensure", "Wir müssen die Sicherheit der Patienten [gewährleisten].", "We must ensure the safety of the patients."]]}
  ];
  var FREE_SIMILAR = [];

  function slug(s) {
    return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z]/g,'');
  }
  var VERBS = [];

  function buildVerbs() {

    DAYS.forEach(function (d, i) {
      d.verbs.forEach(function (r) {

        if (BY_ID[v.id]) return;

    SIMILAR.forEach(function (g) {

  buildVerbs();
  function byId(id) { return BY_ID[id]; }

  /* Picture words (daily-life nouns). Only the free category is inside this file; the others come from the account.
     Each item: [article, German, English, emoji, Wikipedia page title for the photo]. */
  var FREE_WORDS = [
    {"cat": "Obst", "en": "Fruit", "emo": "🍎", "items": [["der", "Apfel", "apple", "🍎", "Apple"], ["die", "Banane", "banana", "🍌", "Banana"], ["die", "Orange", "orange", "🍊", "Orange (fruit)"], ["die", "Zitrone", "lemon", "🍋", "Lemon"], ["die", "Erdbeere", "strawberry", "🍓", "Strawberry"], ["die", "Traube", "grape", "🍇", "Grape"], ["die", "Birne", "pear", "🍐", "Pear"], ["die", "Kirsche", "cherry", "🍒", "Cherry"], ["die", "Ananas", "pineapple", "🍍", "Pineapple"], ["die", "Wassermelone", "watermelon", "🍉", "Watermelon"], ["der", "Pfirsich", "peach", "🍑", "Peach"], ["die", "Heidelbeere", "blueberry", "🫐", "Blueberry"]]}
  ];
  var WORD_CATS = FREE_WORDS.slice();

  /* Grammar lessons. A1 and A2 are inside this file (free); B1, B2 and C1 come from the account (Premium). */
  var FREE_GRAMMAR = [{"id":"a1-pronouns","level":"A1","title":"Pronomen und sein/haben","en":"Pronouns, to be and to have","intro":["The personal pronouns are the subject of the sentence. The two most important verbs, sein (to be) and haben (to have), are irregular, so learn them by heart.","Sie (capital S) is the polite 'you' for strangers, adults you do not know well and at work. It uses the same verb form as sie (they)."],"ex":[["Ich bin Zahnarzt.","I am a dentist."],["Hast du Zeit?","Do you have time?"],["Wir sind müde.","We are tired."],["Sie haben einen Termin.","You have an appointment. (polite)"]],"q":[["Ich ___ aus Indien.",["bin","bist","ist","sind"],0,"With ich we use bin."],["___ du Hunger?",["Bist","Hast","Habe","Hat"],1,"'Hunger haben' uses haben; with du it is hast."],["Er ___ heute krank.",["hat","bin","ist","sind"],2,"With er/sie/es we use ist."],["Wir ___ zwei Kinder.",["sind","haben","hat","habt"],1,"'Kinder haben': wir haben."],["Herr Müller, ___ Sie schon da?",["ist","bist","sind","seid"],2,"Polite Sie takes sind."]],"table":[["","sein","haben"],["ich","bin","habe"],["du","bist","hast"],["er / sie / es","ist","hat"],["wir","sind","haben"],["ihr","seid","habt"],["sie / Sie","sind","haben"]]},{"id":"a1-present","level":"A1","title":"Präsens: regelmäßige Verben","en":"Present tense of regular verbs","intro":["Take the infinitive, remove -en and add the ending: -e, -st, -t, -en, -t, -en.","Verbs whose stem ends in -t or -d add an extra e (du arbeitest, er arbeitet). Some verbs change their vowel with du and er/sie/es: sprechen → du sprichst, fahren → du fährst, lesen → du liest."],"ex":[["Ich lerne Deutsch.","I am learning German."],["Du arbeitest viel.","You work a lot."],["Sie spricht sehr gut Englisch.","She speaks English very well."],["Wir wohnen in Berlin.","We live in Berlin."]],"q":[["Ich ___ in München.",["wohne","wohnst","wohnt","wohnen"],0,"ich + stem + e."],["Du ___ jeden Tag.",["lernt","lerne","lernst","lernen"],2,"du + stem + st."],["Er ___ im Krankenhaus.",["arbeiten","arbeitet","arbeitest","arbeite"],1,"Stem ends in -t, so er arbeitet."],["Was ___ du?",["liest","lest","lese","lesen"],0,"lesen changes e → ie with du: du liest."],["Ihr ___ gut Deutsch.",["sprichst","sprechen","sprecht","spricht"],2,"ihr + stem + t; no vowel change with ihr."]],"table":[["","machen","arbeiten","sprechen"],["ich","mache","arbeite","spreche"],["du","machst","arbeitest","sprichst"],["er/sie/es","macht","arbeitet","spricht"],["wir","machen","arbeiten","sprechen"],["ihr","macht","arbeitet","sprecht"],["sie/Sie","machen","arbeiten","sprechen"]]},{"id":"a1-articles","level":"A1","title":"Nomen und Artikel","en":"Nouns, gender and articles","intro":["Every German noun is masculine (der), feminine (die) or neuter (das) and is written with a capital letter. Always learn the article together with the noun.","The indefinite article is ein (der/das nouns) and eine (die nouns). In the plural the article is always die, and there is no indefinite article: die Bücher, Bücher.","Useful hints: nouns ending in -ung, -heit, -keit, -schaft are feminine; -chen and -lein are neuter; many nouns ending in -er for people are masculine."],"ex":[["der Arzt, die Ärztin","the doctor (male, female)"],["das Kind, die Kinder","the child, the children"],["die Zahnbürste","the toothbrush"],["Ich habe eine Frage.","I have a question."]],"q":[["___ Mädchen ist neun Jahre alt. (-chen)",["Der","Die","Das","Ein"],2,"Words ending in -chen are neuter: das Mädchen."],["___ Wohnung ist teuer. (-ung)",["Der","Die","Das","Den"],1,"Words ending in -ung are feminine."],["Das ist ___ Tisch.",["eine","ein","einen","einem"],1,"der Tisch is masculine; ein in the nominative."],["Das ist ___ Lampe.",["ein","eine","einen","einer"],1,"die Lampe is feminine: eine."],["Plural von 'das Buch':",["die Buchs","die Büche","die Bücher","die Buchen"],2,"das Buch → die Bücher."]]},{"id":"a1-wordorder","level":"A1","title":"Satzbau und Fragen","en":"Word order and questions","intro":["In a normal statement the verb is always in position 2: Ich lerne heute Deutsch. If you start with another element, the subject moves behind the verb: Heute lerne ich Deutsch.","Yes/no questions start with the verb: Lernst du Deutsch? Questions with a question word (wer, was, wo, wann, wie, warum, woher, wohin) put the question word first and the verb second: Wo wohnst du?"],"ex":[["Heute habe ich frei.","Today I have the day off."],["Wann beginnt der Kurs?","When does the course start?"],["Kommst du aus Pakistan?","Do you come from Pakistan?"],["Woher kommen Sie?","Where do you come from? (polite)"]],"q":[["Morgen ___ ich nach Hamburg.",["fahre","ich fahre","fahren","fährt"],0,"Position 1 is 'Morgen', so the verb comes next and the subject follows: Morgen fahre ich."],["___ wohnst du?",["Wo","Wer","Was","Wann"],0,"Wo asks about place."],["Ordne: 'Deutsch / du / sprichst / ?'",["Sprichst du Deutsch?","Du sprichst Deutsch?","Deutsch du sprichst?","Du Deutsch sprichst?"],0,"Yes/no question: verb first."],["___ kommt der Bus? – Um acht Uhr.",["Wo","Wann","Wer","Woher"],1,"Wann asks about time."],["Am Montag ___ Unterricht.",["wir haben","haben wir","wir hat","hat wir"],1,"Verb in position 2, then the subject: Am Montag haben wir Unterricht."]]},{"id":"a1-negation","level":"A1","title":"Verneinung: nicht und kein","en":"Negation: nicht and kein","intro":["Use kein/keine to negate a noun that has ein/eine or no article: Ich habe ein Auto → Ich habe kein Auto. Ich habe Zeit → Ich habe keine Zeit.","Use nicht for everything else: verbs, adjectives, nouns with a definite article. Nicht usually goes at the end of the sentence, or before the word it negates: Ich arbeite nicht. Das ist nicht gut."],"ex":[["Ich habe keine Zeit.","I have no time."],["Er ist nicht müde.","He is not tired."],["Das ist kein Problem.","That is not a problem."],["Ich verstehe das nicht.","I do not understand that."]],"q":[["Ich habe ___ Hunger.",["nicht","kein","keinen","keine"],2,"Hunger is masculine; the negative is keinen in the accusative."],["Das ist ___ gut.",["kein","keine","nicht","nein"],2,"Negating an adjective needs nicht."],["Wir haben ___ Auto.",["nicht","kein","keine","keinen"],1,"das Auto is neuter: kein."],["Sie kommt heute ___.",["kein","keine","nicht","nichts"],2,"A verb is negated with nicht."],["Er hat ___ Geschwister.",["kein","keine","nicht","keinen"],1,"Plural noun: keine."]]},{"id":"a1-akkusativ","level":"A1","title":"Nominativ und Akkusativ","en":"Nominative and accusative","intro":["The nominative is the subject. The accusative is the direct object, the thing that is directly affected by the verb: Ich sehe den Mann.","Only masculine changes: der → den, ein → einen, kein → keinen. Feminine, neuter and plural stay the same."],"ex":[["Ich kaufe einen Apfel.","I buy an apple."],["Er liest das Buch.","He reads the book."],["Wir besuchen die Tante.","We visit the aunt."],["Siehst du den Hund?","Do you see the dog?"]],"q":[["Ich brauche ___ Stift. (der Stift)",["ein","einen","einem","einer"],1,"Masculine accusative: einen."],["Sie liest ___ Zeitung. (die Zeitung)",["den","einen","die","der"],2,"Feminine does not change: die."],["Er kauft ___ Auto. (das Auto)",["ein","einen","eine","einem"],0,"Neuter does not change: ein."],["Wir besuchen ___ Lehrer. (der Lehrer)",["der","den","dem","denen"],1,"Masculine accusative: den."],["Ich habe ___ Bruder. (der Bruder)",["kein","keine","keinen","keinem"],2,"Masculine accusative: keinen."]],"table":[["","Nominativ","Akkusativ"],["maskulin","der / ein","den / einen"],["feminin","die / eine","die / eine"],["neutral","das / ein","das / ein"],["Plural","die / –","die / –"]]},{"id":"a2-dativ","level":"A2","title":"Dativ","en":"The dative case","intro":["The dative marks the indirect object (to whom / for whom): Ich gebe dem Mann das Buch. It also follows certain prepositions: aus, bei, mit, nach, seit, von, zu, and certain verbs: helfen, gefallen, gehören, danken.","Dative articles: dem (der/das nouns), der (die nouns), den + -n on the noun in the plural: den Kindern."],"ex":[["Ich fahre mit dem Bus.","I go by bus."],["Sie hilft ihrer Mutter.","She helps her mother."],["Das Buch gehört meinem Bruder.","The book belongs to my brother."],["Nach dem Unterricht gehe ich nach Hause.","After class I go home."]],"q":[["Ich fahre mit ___ Zug. (der Zug)",["den","dem","der","einen"],1,"mit + dative; masculine: dem."],["Wir wohnen bei ___ Eltern. (die Eltern)",["die","den","dem","der"],1,"bei + dative; plural: den."],["Sie hilft ___ Frau. (die Frau)",["die","den","der","dem"],2,"helfen + dative; feminine: der."],["Nach ___ Essen trinke ich Tee. (das Essen)",["das","dem","den","der"],1,"nach + dative; neuter: dem."],["Das Handy gehört ___ Kind. (das Kind)",["das","dem","den","der"],1,"gehören + dative; neuter: dem."]],"table":[["","Nominativ","Dativ"],["maskulin","der / ein","dem / einem"],["feminin","die / eine","der / einer"],["neutral","das / ein","dem / einem"],["Plural","die","den (+n)"]]},{"id":"a2-perfekt","level":"A2","title":"Perfekt","en":"The perfect tense (spoken past)","intro":["In conversation we use the Perfekt: haben or sein in position 2 + past participle at the end. Regular participle: ge- + stem + -t (gemacht). Irregular: ge- + stem + -en (gesehen, gegangen).","Use sein for verbs of movement or change of state (gehen, fahren, kommen, bleiben, werden, sein): Ich bin nach Hause gegangen. Use haben for most other verbs.","Verbs ending in -ieren and verbs with an inseparable prefix (be-, ver-, er-, ent-, ge-) have no ge-: telefoniert, besucht, verstanden. Separable verbs put ge- in the middle: aufgestanden."],"ex":[["Ich habe Deutsch gelernt.","I learned German."],["Er ist nach Köln gefahren.","He went to Cologne."],["Wir haben den Film gesehen.","We saw the film."],["Sie hat mich angerufen.","She called me."]],"q":[["Gestern ___ ich im Kino gewesen.",["habe","bin","hat","ist"],1,"The perfect of sein is formed with sein: ich bin gewesen."],["Er hat das Buch ___.",["gelesen","gelest","lesen","geliest"],0,"lesen → gelesen (irregular)."],["Wir ___ nach Berlin gefahren.",["haben","hat","sind","seid"],2,"Movement: sein → wir sind gefahren."],["Sie hat den Arzt ___.",["gebesucht","besucht","besuchtet","gebesuchen"],1,"Inseparable prefix be-: no ge-: besucht."],["Ich bin um 7 Uhr ___.",["aufgestehen","gestanden auf","aufgestanden","aufstanden"],2,"aufstehen (separable): auf + ge + standen → aufgestanden, with sein."]]},{"id":"a2-modal","level":"A2","title":"Modalverben","en":"Modal verbs","intro":["können (can), müssen (must), dürfen (may), wollen (want), sollen (should), mögen/möchte (like/would like). The modal verb is in position 2 and the main verb goes to the end as an infinitive.","ich and er/sie/es have the same form for modals and no ending: ich kann, er kann. Möchte is very common for polite requests: Ich möchte einen Kaffee."],"ex":[["Ich kann gut schwimmen.","I can swim well."],["Du musst heute arbeiten.","You have to work today."],["Wir wollen nach Italien fahren.","We want to travel to Italy."],["Darf ich Sie etwas fragen?","May I ask you something?"]],"q":[["Ich ___ heute lange arbeiten.",["muss","musst","müsst","müssen"],0,"ich muss."],["Du ___ hier nicht rauchen.",["darf","dürfen","darfst","dürft"],2,"du darfst."],["Wir ___ morgen früh aufstehen.",["muss","müssen","musst","müsst"],1,"wir müssen."],["Sie kann sehr gut Klavier ___.",["spielt","gespielt","spielen","zu spielen"],2,"After a modal the main verb is an infinitive at the end."],["___ ich Sie etwas fragen?",["Darf","Dürfen","Kannst","Müssen"],0,"Darf ich... is the polite way to ask for permission."]],"table":[["","können","müssen","wollen","möchte"],["ich","kann","muss","will","möchte"],["du","kannst","musst","willst","möchtest"],["er/sie/es","kann","muss","will","möchte"],["wir","können","müssen","wollen","möchten"]]},{"id":"a2-trennbar","level":"A2","title":"Trennbare Verben","en":"Separable verbs","intro":["Many verbs have a prefix that separates in the present tense and goes to the end of the sentence: aufstehen → Ich stehe um 6 Uhr auf. Common prefixes: an-, auf-, aus-, ein-, mit-, vor-, zu-, zurück-, fern-.","With a modal verb the verb stays together at the end: Ich muss um 6 Uhr aufstehen. In a subordinate clause it also stays together: ..., weil ich früh aufstehe."],"ex":[["Der Zug fährt um acht Uhr ab.","The train leaves at eight."],["Ich rufe dich morgen an.","I will call you tomorrow."],["Kommst du mit?","Are you coming along?"],["Ich muss noch einkaufen.","I still have to go shopping."]],"q":[["Ich stehe jeden Tag um 6 Uhr ___. (aufstehen)",["auf","aufstehe","gestanden","stehen"],0,"The prefix goes to the end: Ich stehe ... auf."],["Er ruft seine Mutter ___. (anrufen)",["an","auf","ab","aus"],0,"anrufen: Er ruft seine Mutter an."],["Wann ___ der Film an? (anfangen)",["fängt","fangt","fange","anfängt"],0,"anfangen: er/sie/es fängt ... an (vowel change)."],["Wir müssen jetzt ___.",["aussteigen","steigen aus","ausgestiegen","aus steigen"],0,"With a modal verb the verb is not separated."],["Ich sehe heute Abend ___. (fernsehen)",["fern","fernsehen","ferngesehen","an"],0,"Ich sehe heute Abend fern."]]},{"id":"a2-weil","level":"A2","title":"weil und dass: Verb am Ende","en":"weil and dass: verb at the end","intro":["After conjunctions such as weil (because), dass (that), wenn (if/when), ob (whether) the conjugated verb goes to the very end of the clause.","Main clause + comma + subordinate clause: Ich bleibe zu Hause, weil ich krank bin. If the subordinate clause comes first, the main clause starts with the verb: Weil ich krank bin, bleibe ich zu Hause."],"ex":[["Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","I learn German because I would like to work in Germany."],["Ich glaube, dass er recht hat.","I think that he is right."],["Weil es regnet, bleiben wir zu Hause.","Because it is raining, we stay at home."],["Ich weiß nicht, ob er kommt.","I do not know whether he is coming."]],"q":[["Ich bleibe zu Hause, weil ich krank ___.",["bin","ich bin","sein","ist ich"],0,"Verb at the end: ... weil ich krank bin."],["Er sagt, dass er heute keine Zeit ___.",["hat","hat er","er hat","haben"],0,"dass-clause: verb at the end."],["Weil es spät ist, ___ wir nach Hause.",["gehen","wir gehen","gehen wir","gegangen"],2,"The main clause starts with the verb after a first subordinate clause: ..., gehen wir."],["Ich weiß nicht, ob sie morgen ___.",["kommt","kommen sie","kommt sie","sie kommt"],0,"ob-clause: verb at the end."],["Ich lerne Deutsch, weil ich in Berlin ___ will.",["arbeiten","arbeite","arbeitet","gearbeitet"],0,"With a modal in the subordinate clause: ... arbeiten will."]]},{"id":"a2-wechsel","level":"A2","title":"Wechselpräpositionen","en":"Two-way prepositions (accusative or dative)","intro":["These prepositions can take the accusative or the dative: an, auf, hinter, in, neben, über, unter, vor, zwischen.","Wohin? (movement to a place) → accusative: Ich gehe in die Küche. Wo? (position, no movement to a new place) → dative: Ich bin in der Küche.","Stellen/legen/setzen/hängen (put) go with accusative; stehen/liegen/sitzen/hängen (be somewhere) go with dative."],"ex":[["Ich lege das Buch auf den Tisch.","I put the book on the table."],["Das Buch liegt auf dem Tisch.","The book is lying on the table."],["Wir gehen in die Stadt.","We go into town."],["Er wartet vor der Tür.","He is waiting in front of the door."]],"q":[["Ich gehe in ___ Park. (der Park)",["der","dem","den","einem"],2,"Wohin? movement → accusative: in den Park."],["Ich bin in ___ Park. (der Park)",["den","dem","der","einen"],1,"Wo? position → dative: im/in dem Park."],["Die Lampe hängt über ___ Tisch. (der Tisch)",["den","dem","der","das"],1,"Position → dative: über dem Tisch."],["Sie stellt die Flasche auf ___ Tisch. (der Tisch)",["dem","den","der","das"],1,"Movement (stellen) → accusative: auf den Tisch."],["Das Kino ist ___ Bahnhof. (neben, der Bahnhof)",["neben dem","neben den","neben die","neben der"],0,"Position, masculine dative: neben dem Bahnhof."]]}];
  var GRAMMAR = FREE_GRAMMAR.slice();
  var GRAM_LOCKED = { B1:6, B2:6, C1:5 };

  /* =====================================================
     SESSION STATE
     ===================================================== */
  var S = null;               // current session or null
  var tab = 'practise';
  var offlineReady = false;

  function newSession(mode) {
    return { mode:mode, i:0, correct:0, total:0, points:0, run:0, bestRun:0, missed:[], finished:false };
  }
  function startSession(mode) {
    if (mode === 'review' && !mistakes().length) return;
    if (PREMIUM_MODES.indexOf(mode) >= 0 && !account.premium) { openUpgrade(); return; }
    S = newSession(mode);
    if (mode === 'cards') {
      S.queue = shuffle(pick(pool(), 15).map(function (v) { return v.id; }));
      S.initial = S.queue.length; S.resolved = 0; S.retries = {}; S.flipped = false; S.justFlipped = false;
    } else {
      S.qs = buildQuestions(mode);
    }
    render(true);
  }
  function startSpeak(ids) {
    if (!account.premium) { openUpgrade(); return; }
    var list = (ids ? ids.map(byId) : pick(pool(), 10)).filter(Boolean);
    if (!list.length) return;
    stopListening(true);
    S = newSession('speak');
    S.qs = list.map(function (v) { return { id:v.id, status:'idle', msg:'', attempts:0, passed:false, result:null }; });
    S.single = !!ids; S.ids = ids || null; S.target = state.speakTarget;
    render(true);
  }
  function nextSpeak() {
    var q = S.qs[S.i];
    stopListening(true);
    S.total++;
    if (q.passed) S.correct++; else if (S.missed.indexOf(q.id) < 0) S.missed.push(q.id);
    if (S.i < S.qs.length - 1) { S.i++; render(true); } else { finishSession(); render(true); }
  }
  function finishSession() {
    S.finished = true;
    state.stats.sessions++;
    save();
  }
  function noteResult(id, ok, pts) {
    S.total++;
    if (ok) { S.correct++; S.points += pts; S.run++; if (S.run > S.bestRun) S.bestRun = S.run; }
    else { S.run = 0; if (S.missed.indexOf(id) < 0) S.missed.push(id); }
  }
  function answerQuestion(q, ok) {
    q.done = true; q.correct = ok;
    q.pts = record(q.id, ok);
    noteResult(q.id, ok, q.pts);
    if (!ok && S.mode === 'review' && !q.retried) {
      var again = makeQ(byId(q.id), rand(TYPE_KINDS.concat(MC_KINDS)));
      again.retried = true;
      S.qs.push(again);
    }
  }

  function viewProgress() {

    var h = '<h1 class="page-title">Progress</h1><div class="stats">' +

  function stat(n, label) { return '<div><b>' + esc(n) + '</b><span>' + esc(label) + '</span></div>'; }

  /* ---- session views ---- */
  function sessionBar(done, total, noStats) {
    var pct = total ? Math.round(100 * done / total) : 0;
    return '<header class="sbar"><button class="icon-btn" data-act="close" aria-label="Close and go back">' + icon('close') + '</button>' +
      '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><i style="width:' + pct + '%"></i></div>' +
      '<span class="count">' + Math.min(done + 1, total) + '/' + total + '</span></header>' +
      (noStats ? '' : '<div class="stline"><span>Streak <b>' + state.stats.streak + '</b></span><span>Points <b>' + state.stats.score + '</b></span></div>');
  }
  function gapBlock(v) {
    return '<p class="sentence">' + blank(v.ex) + '</p><p class="hint-tr">' + esc(v.tr) + '</p>';
  }

  function viewQuestion() {
    var q = S.qs[S.i], v = byId(q.id), isType = q.kind.indexOf('type') === 0;
    var label = '', prompt = '';
    switch (q.kind) {
      case 'de-en':    label = 'What does this verb mean?';            prompt = '<p class="word">' + esc(v.de) + '</p>'; break;
      case 'en-de':    label = 'Which German verb means this?';        prompt = '<p class="word en">' + esc(v.en) + '</p>'; break;
      case 'gap':      label = 'Which verb fits the gap?';             prompt = gapBlock(v); break;
      case 'type-en':  label = 'Type the German verb.';                prompt = '<p class="word en">' + esc(v.en) + '</p>'; break;
      case 'type-gap': label = 'Type the missing verb in its basic form (infinitive).'; prompt = gapBlock(v); break;
    }
    var h = sessionBar(S.i, S.qs.length) + '<p class="qlabel">' + label + '</p>' + prompt;

    if (!isType) {
      h += '<div class="opts">' + q.opts.map(function (id) {
        var o = byId(id), text = q.kind === 'de-en' ? o.en : o.de, cls = 'opt' + (q.kind === 'de-en' ? '' : ' de-opt');
        if (q.done) cls += id === q.id ? ' correct' : (id === q.picked ? ' wrong' : ' dim');
        return '<button class="' + cls + '" data-act="pick" data-id="' + id + '"' + (q.done ? ' disabled' : '') + '><span>' + esc(text) + '</span></button>';
      }).join('') + '</div>';
    } else {
      var fcls = q.done ? (q.correct ? ' good' : ' bad') : '';
      h += '<input id="ans" class="field' + fcls + '" type="text" inputmode="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="Type here" aria-label="Your answer" value="' + esc(q.typed) + '"' + (q.done ? ' disabled' : '') + '>';
      if (!q.done) {
        var c = core(v);
        h += '<p class="hintline">' + (q.hint ? 'Starts with "' + esc(c.charAt(0)) + '", ' + c.length + ' letters.' + (v.de !== c ? ' ("sich" is optional.)' : '') : '') + '</p>';
        h += '<div class="btns"><button class="btn ghost" data-act="hint">Hint</button><button class="btn" data-act="check">Check</button></div>';
      }
    }

    if (q.done) {
      var last = S.i >= S.qs.length - 1;
      h += '<section class="fb ' + (q.correct ? 'good' : 'bad') + '" role="status"><h3>' + (q.correct ? 'Richtig!' : 'Nicht ganz.') +
        (q.correct ? '<span class="pts">+' + q.pts + ' points</span>' : '') + '</h3>';
      if (isType && !q.correct && q.typed.trim()) h += '<p class="line muted">You typed: ' + esc(q.typed.trim()) + '</p>';
      if (q.note) h += '<p class="line small">' + esc(q.note) + '</p>';
      h += '<p class="line"><span class="de">' + esc(v.de) + '</span> means ' + esc(v.en) + '.</p>' +
        '<p class="ex">' + hl(v.ex) + ' ' + sayBtn(plain(v.ex), 'example sentence') + '</p><p class="tr">' + esc(v.tr) + '</p>' +
        '<button class="btn" data-act="next">' + (last ? 'See results' : 'Next question') + '</button></section>';
    }
    return h;
  }

  function viewSpeak() {
    var q = S.qs[S.i], v = byId(q.id), sentence = S.target === 'sentence';
    var h = sessionBar(S.i, S.qs.length, true);

    h += '<p class="qlabel">' + esc(v.en) + '</p>';

    var res = q.status === 'result' ? q.result : null;
    function coloured(marks) {
      return marks.map(function (m) { return '<span class="w ' + m.st + '">' + esc(m.w) + '</span>'; }).join(' ');
    }
    if (sentence) {
      h += '<p class="sentence spoken">' + (res ? coloured(res.marks) : hl(v.ex)) + '</p><p class="hint-tr">' + esc(v.tr) + '</p>';

    }
    var say = sentence ? plain(v.ex) : plain(v.de);

    if (q.status === 'idle' || q.status === 'listening') {
      var live = q.status === 'listening';
      h += '<button class="mic' + (live ? ' live' : '') + '" data-act="mic" aria-label="' + (live ? 'Stop listening' : 'Start speaking') + '">' + icon('mic') + '</button>' +

    } else {
      var r = q.result, last = S.i >= S.qs.length - 1;

      if (!r.pass) h += '<p class="line small">Red words were not recognised. Listen to the example, then try again.</p>';
      else if (!r.perfect) h += '<p class="line small">Yellow means close. Check the ending or the stress.</p>';
      h += '<div class="btns"><button class="btn ghost" data-act="say" data-say="' + esc(say) + '">Hear it</button><button class="btn ghost" data-act="again">Try again</button></div>' +
        '<button class="btn" data-act="speaknext">' + (last ? 'See results' : 'Next') + '</button></section>';
    }
    return h;
  }

  function viewCards() {
    var id = S.queue[0], v = byId(id);

  function viewSummary() {
    var pct = S.total ? Math.round(100 * S.correct / S.total) : 0;

  function photoUrl(title) {

    return fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')), { headers:{ Accept:'application/json' } })
      .then(function (r) { if (!r.ok) { if (r.status === 404) PHOTO[title] = false; return null; } return r.json(); })

  function viewChat() {
    var h = '<h1 class="page-title">Chat</h1>';
    if (!SB_OK) return h + '<p class="muted">The chat is not switched on in this copy of the app.</p>';
    if (!account.session) return h + '<p class="muted">Write German with other learners. Sign in to your account first.</p><button class="btn" data-act="tab" data-v="account">Go to Account</button>';
    if (!account.premium) return h + '<div class="upsell"><b>Chat is for Premium members.</b> Write German with other learners in rooms for A1, A2, B1 and B2. Included with Premium (from ' + priceFrom() + ', cancel anytime).<button class="btn" data-act="upgrade">See Premium</button></div>';
    if (account.offline) return h + '<p class="muted">The chat needs an internet connection.</p>';
    if (CH.phase === 'load' || CH.phase === 'idle') return h + '<p class="muted">Loading...</p>';
    if (CH.phase === 'error') return h + '<p class="fb bad" style="padding:14px">' + esc(CH.err) + '</p><button class="btn" data-act="chretry">Try again</button>';
    if (CH.phase === 'banned') return h + '<p class="muted">' + esc(CHAT_ERR.banned) + ' Contact support if you think this is a mistake.</p>';
    if (CH.phase === 'setup') {
      h += '<p class="muted">Choose a nickname. Other members will see only this nickname, never your email.</p>';
      h += '<label class="lbl" for="chnick">Nickname (3 to 20 letters, numbers or _)</label>' +
        '<input id="chnick" class="field fs" type="text" maxlength="20" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" value="' + esc(CH.nickDraft) + '">';
      h += '<div class="rules"><b>Chat rules</b><ul><li>Write in German when you can. Mistakes are fine.</li><li>Be kind. No insults, hate, harassment or spam.</li><li>Do not share private data (phone, address, passwords, bank details).</li><li>Messages are visible to all Premium members in the room and are deleted after 30 days.</li><li>You can report or block anyone. Reports are read by the app owner, who can remove messages and members.</li></ul></div>';
      h += '<label class="chk"><input id="chaccept" type="checkbox"' + (CH.accept ? ' checked' : '') + '> I accept the chat rules</label>';
      if (CH.err) h += '<p class="fb bad" style="padding:12px">' + esc(CH.err) + '</p>';
      return h + '<button class="btn" data-act="chjoin"' + (CH.busy ? ' disabled' : '') + '>' + (CH.busy ? 'Please wait...' : 'Join the chat') + '</button>';
    }
    h += '<div class="chips" role="group" aria-label="Chat room">' + CHAT_ROOMS.map(function (r) {
      return '<button data-act="chroom" data-v="' + r[0] + '" aria-pressed="' + (CH.room === r[0]) + '">' + r[1] + '</button>';
    }).join('') + '</div>';
    h += '<p class="say-note" style="margin:2px 0 8px">You are <b>' + esc(CH.nick) + '</b> in room ' + esc(CH.room.toUpperCase()) + '. Be kind. Never share private data.</p>';
    h += '<div id="chatlist" class="chatlist" aria-live="polite">' + chatListHtml() + '</div>';
    h += '<p id="chatinfo" class="say-note" role="status">' + esc(CH.info || CH.err) + '</p>';
    h += '<div class="tform"><input id="chmsg" class="field fs" type="text" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="Schreib etwas..." aria-label="Your message" value="' + esc(CH.draft) + '">' +
      '<button id="chsend" class="btn" data-act="chsend">Send</button></div>';
    h += '<p class="say-note"><button class="linkbtn" data-act="chunblock">Unblock everyone I blocked</button></p>';
    return h;
  }

  /* =====================================================
     RENDER
     ===================================================== */
  function renderNav() {
    var items = state.track === 'allg'
      ? [['practise','Practise'], ['verbs','Verbs'], ['words','Words'], ['grammar','Grammar'], ['chat','Chat'], ['progress','Progress'], ['account','Account']]
      : [['fvocab','Vocabulary'], ['fphrase','Phrases'], ['fdialog','Dialogues'], ['chat','Chat'], ['account','Account']];
    $('#nav').innerHTML = items.map(function (it) {
      return '<button data-act="tab" data-v="' + it[0] + '"' + (tab === it[0] ? ' aria-current="page"' : '') + '><span class="pill">' + icon(it[0]) + '</span>' + it[1] + '</button>';
    }).join('');
  }
  function render(toTop) {
    var app = $('#app'), html;
    if (builtLang !== curLang()) { builtLang = curLang(); buildVerbs(); buildWords(); }
    if (uiBuilt !== uiLang()) uiSet();
    if (P) {
      document.body.classList.add('in-session');
      html = viewPic();
    } else if (S) {
      document.body.classList.add('in-session');
      if (S.finished) html = viewSummary();
      else html = S.mode === 'cards' ? viewCards() : (S.mode === 'speak' ? viewSpeak() : viewQuestion());
    } else {
      document.body.classList.remove('in-session');
      var isF = /^f(vocab|phrase|dialog)$/.test(tab);
      if (state.track !== 'allg' && !isF && tab !== 'chat' && tab !== 'account') tab = 'fvocab';
      if (state.track === 'allg' && isF) tab = 'practise';
      html = tab === 'verbs' ? viewVerbs() : (tab === 'progress' ? viewProgress() : (tab === 'account' ? viewAccount() : (tab === 'chat' ? viewChat() : (tab === 'words' ? viewWords() : (tab === 'grammar' ? viewGrammar() : (/^f(vocab|phrase|dialog)$/.test(tab) ? viewFsp() : viewPractise()))))));
      renderNav();
      html = trackBar() + html;
    }
    app.innerHTML = html;
    if (!S && tab === 'verbs' && vsearch) applySearch();
    hydratePhotos();
    if (toTop) window.scrollTo(0, 0);
    if (tab === 'chat' && !S && !P) { var cl = $('#chatlist'); if (cl) cl.scrollTop = cl.scrollHeight; }
  }
  function scrollToFeedback() {
    var fb = $('.fb');
    if (fb && fb.scrollIntoView) { try { fb.scrollIntoView({ block:'end', behavior:'smooth' }); } catch (e) { fb.scrollIntoView(false); } }
  }

  /* =====================================================
     EVENTS
     ===================================================== */
  function currentQ() { return S && S.qs ? S.qs[S.i] : null; }

  function doCheck() {
    var q = currentQ(); if (!q || q.done) return;
    var input = $('#ans'); if (!input) return;
    var val = input.value;
    if (!val.trim()) { input.focus(); return; }
    q.typed = val;
    var r = checkTyped(byId(q.id), val);
    q.note = r.note;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    answerQuestion(q, r.ok);
    render(); scrollToFeedback();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    var q = currentQ();

    switch (act) {
      case 'tab': tab = v; if (v !== 'chat') chatStop(); render(true); if (v === 'chat') chatOpen(); break;
      case 'xtrack':
        if (v === 'allg' || v === 'zm' || v === 'med') { state.track = v; F = { id:'', mode:'', c:null, z:null, d:null }; tab = v === 'allg' ? 'practise' : 'fvocab'; chatStop(); save(); render(true); }
        break;
      case 'xopen': F = { id:v, mode:'', c:null, z:null, d:null }; render(true); break;
      case 'xback': if (F.mode) { F.mode = ''; F.c = F.z = F.d = null; } else { F.id = ''; } render(true); break;
      case 'wsub': if (v === 'pic' || v === 'lvl') { wsub = v; F = { id:'', mode:'', c:null, z:null, d:null }; render(true); } break;
      case 'xmode': fspMode(v); break;
      case 'xflip': if (F.c) { F.c.flipped = !F.c.flipped; render(); } break;
      case 'xgot': fspCard(true); break;
      case 'xagain': fspCard(false); break;
      case 'xpick': fspPick(Number(el.getAttribute('data-i'))); break;
      case 'xnext': fspNext(); break;
      case 'xrole': fspRole(v); break;
      case 'xcont': if (F.d) { F.d.i++; F.d.rev = false; render(); window.scrollTo(0, document.body.scrollHeight); } break;
      case 'xrev': if (F.d) { F.d.rev = true; render(); } break;
      case 'glevel': G.level = v; G.topic = ''; G.quiz = null; render(); break;
      case 'gopen': G.topic = v; G.quiz = null; render(true); break;
      case 'gback': if (G.quiz && !G.quiz.finished) { G.quiz = null; } else { G.quiz = null; G.topic = ''; } render(true); break;
      case 'gstart': gramStart(); break;
      case 'gpick': gramPick(Number(el.getAttribute('data-i'))); break;
      case 'gnext': gramNext(); break;
      case 'chretry': chatReset(); chatOpen(); break;
      case 'chjoin': chatJoin(); break;
      case 'chroom': CH.room = v; CH.msgs = []; CH.err = ''; render(); chatFetch(true); break;
      case 'chsend': chatSend(); break;
      case 'chrep': chatCall('chat_report', { p_id:Number(el.getAttribute('data-id')), p_reason:'reported by member' }, 'Thank you. The message was reported.', 'Report this message to the app owner?'); break;
      case 'chblock': chatCall('chat_block', { p_id:Number(el.getAttribute('data-id')) }, 'Blocked. You will no longer see this person.', 'Block this person? You will no longer see their messages.'); break;
      case 'chdel': chatDelete(el.getAttribute('data-id')); break;
      case 'chunblock': chatCall('chat_unblock_all', {}, 'Everyone is unblocked.', 'Unblock everyone you blocked?'); break;
      case 'toggleEn': state.englishFirst = !state.englishFirst; save(); render(); break;
      case 'hideInstall': state.hideInstall = true; save(); render(); break;
      case 'start': if (el.getAttribute('data-mode') === 'speak') startSpeak(null); else startSession(el.getAttribute('data-mode')); break;
      case 'close': stopListening(true); S = null; P = null; render(true); break;
      case 'speakOne': if (!account.premium) { openUpgrade(); break; } startSpeak([el.getAttribute('data-id')]); break;
      case 'speakagain': startSpeak(S.single ? S.ids : null); break;
      case 'speakTarget':
        state.speakTarget = v; save();
        if (S && S.mode === 'speak') { stopListening(true); S.target = v; var sq = S.qs[S.i]; if (sq.status !== 'idle') { sq.status = 'idle'; sq.msg = ''; sq.result = null; } render(); }
        break;
      case 'mic':
        if (REC) stopListening(false); else startListening();
        break;
      case 'speaknext': nextSpeak(); break;
      case 'say': speak(el.getAttribute('data-say')); break;
      case 'sendcode': sendCode(); break;
      case 'havecode':
        var hi = $('#acEmail'), he = ((hi ? hi.value : account.email) || '').trim().toLowerCase();
        if (!emailOk(he)) { setMsg('Type your email address first.', 'bad'); render(); break; }
        account.email = he; account.step = 'code'; setMsg('Enter the code from your email.', ''); render();
        break;
      case 'verify': verifyCode(); break;
      case 'changeemail': account.step = 'email'; setMsg(''); render(); break;
      case 'signout': signOut(); break;
      case 'buy': startCheckout(v); break;
      case 'portal': openPortal(); break;
      case 'checkbuy': checkPurchase(); break;
      case 'upgrade': openUpgrade(); break;
      case 'wstart': startPics(el.getAttribute('data-mode')); break;
      case 'wopen': wscope = Number(el.getAttribute('data-i')); render(true); break;
      case 'wflip': if (P && P.mode === 'pcards' && !P.flipped) { P.flipped = true; render(); } break;
      case 'wknown':
      case 'wagain':
        if (!P || P.mode !== 'pcards' || !P.flipped) break;
        var wid = P.queue.shift(), wok = (act === 'wknown');
        precord(wid, wok); pNoteResult(wid, wok);
        if (wok) P.resolved++;
        else { P.retries[wid] = (P.retries[wid] || 0) + 1; if (P.retries[wid] <= 2) P.queue.push(wid); else P.resolved++; }
        P.flipped = false;
        if (!P.queue.length) pFinish();
        render(true);
        break;
      case 'wpickans':
        var wq = P && P.qs ? P.qs[P.i] : null;
        if (!wq || wq.done) break;
        wq.picked = el.getAttribute('data-id'); pAnswer(wq, wq.picked === wq.id); render(); scrollToFeedback();
        break;
      case 'wcheck': doWCheck(); break;
      case 'wnext':
        if (P && P.qs) { if (P.i < P.qs.length - 1) { P.i++; render(true); var wf = $('#wans'); if (wf) { try { wf.focus(); } catch (err2) {} } } else { pFinish(); render(true); } }
        break;

      case 'pick':
        if (!q || q.done) break;
        q.picked = el.getAttribute('data-id');
        answerQuestion(q, q.picked === q.id);
        render(); scrollToFeedback();
        break;
      case 'check': doCheck(); break;
      case 'hint':
        if (!q || q.done) break;
        var inp = $('#ans'); if (inp) q.typed = inp.value;
        q.hint = true; render();
        var again = $('#ans'); if (again) again.focus();
        break;
      case 'next':
        if (S.i < S.qs.length - 1) { S.i++; render(true);
          var f = $('#ans'); if (f) { try { f.focus(); } catch (err) {} } }
        else { finishSession(); render(true); }
        break;

      case 'flip':
        if (!S.flipped) { S.flipped = true; S.justFlipped = true; render(); }
        break;
      case 'known':
      case 'again':
        if (S.mode === 'speak') { var cq = S.qs[S.i]; cq.status = 'idle'; cq.msg = ''; cq.result = null; render(); break; }
        if (!S.flipped) break;
        var id = S.queue.shift(), ok = (act === 'known');
        var pts = record(id, ok);
        noteResult(id, ok, pts);
        if (ok) { S.resolved++; }
        else {
          S.retries[id] = (S.retries[id] || 0) + 1;
          if (S.retries[id] <= 2) S.queue.push(id); else S.resolved++;
        }
        S.flipped = false;
        if (!S.queue.length) finishSession();
        render(true);
        break;

      case 'reset':
        if (window.confirm(state.owner ? 'Delete all your scores and progress, also in your account? This cannot be undone.' : 'Delete all your scores and progress on this device? This cannot be undone.')) {
          var keepInstall = state.hideInstall;
          var owner = state.owner;
          state = defaults(); state.hideInstall = keepInstall; state.owner = owner; save(); render(true);
          if (canSync()) pushNow();
        }
        break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var which = t.getAttribute('data-sel');
    if (which === 'scopeSel') { state.scope = parseScope(t.value); save(); render(); }
    else if (which === 'verbsSel') { verbsScope = parseScope(t.value); render(); }
    else if (which === 'langSel') { if (t.value === 'en' || LANGS.some(function (l) { return l[0] === t.value; })) { state.lang = t.value; save(); render(); } }
    else if (which === 'uiSel') { if (t.value === 'en' || LANGS.some(function (l) { return l[0] === t.value; })) { state.ui = t.value; save(); uiSet(); render(); } }
    else if (which === 'wordsSel') { wscope = (t.value === 'all') ? 'all' : Number(t.value); render(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'vsearch') { vsearch = e.target.value; applySearch(); }
    if (e.target && e.target.id === 'acEmail') account.email = e.target.value;
    if (e.target && e.target.id === 'chmsg') CH.draft = e.target.value;
    if (e.target && e.target.id === 'chnick') CH.nickDraft = e.target.value;
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'ans') { e.preventDefault(); doCheck(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'wans') { e.preventDefault(); doWCheck(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'chmsg') { e.preventDefault(); chatSend(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'acEmail') { e.preventDefault(); sendCode(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'acCode') { e.preventDefault(); verifyCode(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && S && S.mode === 'cards') {
      e.preventDefault(); if (!S.flipped) { S.flipped = true; S.justFlipped = true; render(); }
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && P && P.mode === 'pcards') {
      e.preventDefault(); if (!P.flipped) { P.flipped = true; render(); }
    }
  });

  /* =====================================================
     START + OFFLINE SUPPORT
     ===================================================== */
  account.session = loadStoredSession();
  (function startUp() {
    var back = false;
    try {
      var q = new URLSearchParams(window.location.search);
      if (q.get('checkout') === 'return') {
        back = true;
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch (e) {}
    if (back) {
      tab = 'account';
      if (!account.session) setMsg('Thank you! Please sign in with the SAME email address you used to pay. Premium will then unlock.', 'good');
    }
    render(true);
    if (back && account.session && SB_OK) pollAfterCheckout();
    else refreshAccount().then(pullProgress);
  })();
  window.addEventListener('online', function () { if (SB_OK && account.session) refreshAccount().then(pullProgress); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && SB_OK && account.session && !account.waiting && Date.now() - account.lastRefresh > 60000) refreshAccount();
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').then(function () {
        return navigator.serviceWorker.ready;
      }).then(function () {
        offlineReady = true;
        if (!S) render();
      }).catch(function () { /* app still works online without it */ });
    });
  }
})();
</script>
</body>
</html>
